name: API — Build, Push & Deploy

# Runs after every merge to main that touches the API or this workflow file.
# Two jobs:
#   1. build-and-push — produces a versioned Docker image in GHCR
#   2. deploy         — updates the Azure Container App to that exact image
#
# GHCR is free for public repos and free up to the Actions storage quota for
# private repos. No external registry account needed — it's tied to your
# GitHub account automatically.

on:
  push:
    branches:
      - main
    paths:
      - "src/api/**"
      - ".github/workflows/api-cd.yml"

env:
  # Image name format: ghcr.io/OWNER/REPO/IMAGE
  # github.repository is "pereiratc/finance-platform" automatically.
  IMAGE_NAME: ghcr.io/${{ github.repository }}/api

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    # packages: write — allows the job to push images to GHCR.
    # contents: read  — allows checking out your code.
    permissions:
      contents: read
      packages: write

    # Expose the pushed image's digest so the deploy job can pin to it.
    # NOTE: the id here (build-and-push) must match the id: on the build step below.
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the code
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up Docker Buildx
      #
      # Buildx is the modern Docker build driver. It supports BuildKit features
      # used in this workflow: cache-to/cache-from (layer caching) and better
      # error output. The default Docker builder on GitHub runners doesn't.
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # 3. Log in to GitHub Container Registry
      #
      # GITHUB_TOKEN is automatically provided by Actions — no manual secret
      # setup needed. It's scoped to the repo and expires when the job ends.
      # -----------------------------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 4. Extract metadata for image tags and labels
      #
      # For a push to main, docker/metadata-action produces:
      #   ghcr.io/pereiratc/finance-platform/api:main
      #   ghcr.io/pereiratc/finance-platform/api:sha-a1b2c3d
      #
      # The SHA tag pins each image to the exact commit that produced it.
      # The 'main' tag floats — always the most recent image from main.
      # -----------------------------------------------------------------------
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      # -----------------------------------------------------------------------
      # 5. Build and push
      #
      # context: repo root, so the Dockerfile's COPY paths resolve correctly.
      # push: true — actually push to GHCR.
      # cache-from / cache-to: Docker layer caching via the Actions cache, so
      # the expensive NuGet restore layer is reused when dependencies are
      # unchanged (60-90s cold -> under 5s cached).
      # -----------------------------------------------------------------------
      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/api/FinancePlatform.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------------------
      # 6. Print image digest
      #
      # The digest (sha256:...) is a content hash of the image manifest. It
      # uniquely identifies this exact image independent of tags.
      # -----------------------------------------------------------------------
      - name: Print image digest
        run: echo "Image pushed with digest ${{ steps.build-and-push.outputs.digest }}"

  # ===========================================================================
  # Deploy — update the Container App to the image we just built.
  # Runs only after build-and-push succeeds. Authenticates with OIDC, so there
  # is no password anywhere — just the three ID secrets (client/tenant/sub).
  # ===========================================================================
  deploy:
    name: Deploy to Azure Container Apps
    needs: build-and-push
    runs-on: ubuntu-latest

    # id-token: write — lets the job request a short-lived OIDC token.
    # contents: read  — standard least-privilege default.
    permissions:
      id-token: write
      contents: read

    steps:
      # Passwordless login via the federated credential created in Entra ID.
      # The azure/login action handles the OIDC token exchange under the hood.
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Point the app at the exact digest CI just pushed.
      # Deploying by digest guarantees a new revision every time and pins the
      # precise bits that were built. Only the image changes — Key Vault wiring,
      # env vars, managed identity, and App Insights are all left untouched.
      - name: Deploy to Container Apps
        run: |
          az extension add --name containerapp --only-show-errors
          az containerapp update --name ca-finance-api --resource-group rg-finance-platform-dev --image ${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}